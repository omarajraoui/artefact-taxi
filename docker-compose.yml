# Chicago Taxi Trips datalake: SeaweedFS (S3-compatible object storage) + Airflow (orchestration, PySpark jobs) + API/dashboard.
# One command: `docker compose up -d --build`. The DAG runs once by itself at start-up (schedule @once).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: taxi-airflow:local
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./seeds:/opt/airflow/seeds
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    bucket-init:
      condition: service_completed_successfully

services:
  # ---------- Object storage (the datalake): SeaweedFS, S3-compatible ----------
  # (MinIO's free images and binaries were withdrawn in 2025: docker pull minio/minio is denied, dl.min.io answers 410.)
  s3:
    image: chrislusf/seaweedfs:3.80
    entrypoint: /bin/sh
    command:
      - -c
      - |
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0 -ip=s3 -ip.bind=0.0.0.0
    env_file: .env
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer web UI (browse the datalake)
    volumes:
      - s3-data:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || wget -q -S -O /dev/null http://localhost:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket once the store answers (boto3, from the API image).
  bucket-init:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: taxi-api:local
    env_file: .env
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, time, boto3
        from botocore.client import Config
        s3 = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT"], aws_access_key_id=os.environ["S3_ACCESS_KEY"],
                          aws_secret_access_key=os.environ["S3_SECRET_KEY"], region_name="us-east-1", config=Config(s3={"addressing_style": "path"}))
        for i in range(30):
            try:
                if os.environ["S3_BUCKET"] not in [b["Name"] for b in s3.list_buckets()["Buckets"]]:
                    s3.create_bucket(Bucket=os.environ["S3_BUCKET"])
                print("bucket ready:", os.environ["S3_BUCKET"]); break
            except Exception as e:
                print("waiting for the store:", e); time.sleep(2)
        else:
            raise SystemExit("object store not reachable")
    restart: "no"

  # ---------- Airflow metadata database ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Airflow ----------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Data --lastname Engineer --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    mem_limit: 1g
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # The Spark jobs run inside this container (local mode): SPARK_DRIVER_MEMORY must stay well under this cap.
    mem_limit: ${SCHEDULER_MEM_LIMIT:-3g}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- Exposition: SQL over the gold layer (DuckDB) + small dashboard ----------
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: taxi-api:local
    env_file: .env
    mem_limit: 512m
    ports:
      - "8000:8000"
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  s3-data:
  postgres-data:
  airflow-logs:
